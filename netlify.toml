[build]
  command = "pnpm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "README.md,.env.example"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_PAYPAL_CLIENT_ID,PAYPAL_CLIENT_ID,PAYPAL_ENVIRONMENT,PAYPAL_BASE_URL,OPENROUTER_MODEL"
